# 生产/集成环境编排。本机开发不用它——MinIO 走 infra/scripts 里的原生进程脚本。
#
# 所有凭据从环境变量读取，不写在这里。复制 .env.example 成 .env 后再起。

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${SM_DB_NAME:-skill_mesh}
      POSTGRES_USER: ${SM_DB_USER}
      POSTGRES_PASSWORD: ${SM_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SM_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SM_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SM_MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      SM_DB_URL: jdbc:postgresql://postgres:5432/${SM_DB_NAME:-skill_mesh}
      SM_DB_USER: ${SM_DB_USER}
      SM_DB_PASSWORD: ${SM_DB_PASSWORD}
      SM_MINIO_ENDPOINT: http://minio:9000
      SM_MINIO_ACCESS_KEY: ${SM_MINIO_ACCESS_KEY}
      SM_MINIO_SECRET_KEY: ${SM_MINIO_SECRET_KEY}
      SM_MINIO_BUCKET: ${SM_MINIO_BUCKET:-skillmesh-artifacts}
      # 内置账号的令牌签名密钥：固定下来，不配就是每次启动随机生成，
      # 重启后所有已登录的令牌都失效。
      SM_JWT_SECRET: ${SM_JWT_SECRET}
      # 能不能自助注册。关掉就只能由管理员建号。
      SM_ALLOW_REGISTER: ${SM_ALLOW_REGISTER:-true}
      # 限流（次/分钟）。0 表示关闭；首次同步大量 Skill 时默认值可能不够。
      SM_RATE_LIMIT_READ: ${SM_RATE_LIMIT_READ:-600}
      SM_RATE_LIMIT_WRITE: ${SM_RATE_LIMIT_WRITE:-300}
      SM_RATE_LIMIT_WINDOW: ${SM_RATE_LIMIT_WINDOW:-60}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
