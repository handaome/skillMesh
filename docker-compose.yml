# 生产/集成环境编排。本机开发不用它——MinIO 与 Keycloak 走 infra/scripts 里的原生进程脚本。
#
# 所有凭据从环境变量读取，不写在这里。复制 .env.example 成 .env 后再起。

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${SM_DB_NAME:-skill_mesh}
      POSTGRES_USER: ${SM_DB_USER}
      POSTGRES_PASSWORD: ${SM_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SM_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SM_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SM_MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --http-relative-path=/kc
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SM_KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SM_KEYCLOAK_ADMIN_PASSWORD}
      # 固定对外地址：浏览器拿到的令牌 iss 要与对外一致（容器内的 keycloak:8080
      # 浏览器解析不了）。生产环境必须换成正式 OIDC provider 的 issuer。
      KC_HOSTNAME: http://127.0.0.1:8180/kc
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data

  api:
    build:
      context: ./apps/api
    environment:
      SM_DB_URL: jdbc:postgresql://postgres:5432/${SM_DB_NAME:-skill_mesh}
      SM_DB_USER: ${SM_DB_USER}
      SM_DB_PASSWORD: ${SM_DB_PASSWORD}
      SM_MINIO_ENDPOINT: http://minio:9000
      SM_MINIO_ACCESS_KEY: ${SM_MINIO_ACCESS_KEY}
      SM_MINIO_SECRET_KEY: ${SM_MINIO_SECRET_KEY}
      SM_MINIO_BUCKET: ${SM_MINIO_BUCKET:-skillmesh-artifacts}
      # 容器里的 127.0.0.1 是 api 自己，不是 keycloak：用 jwk-set-uri 走容器内地址。
      # 代价是不校验令牌里的 iss（容器内外 issuer 本就对不上，见 keycloak 的 KC_HOSTNAME）。
      SM_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/kc/realms/skillmesh/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  keycloak-data:
