spring:
  application:
    name: skillmesh-api
  config:
    # 从仓库根的 .env 读凭据。.env 是 KEY=VALUE 格式，与 properties 兼容；
    # 显式指定 [.properties] 否则 Spring 会因扩展名不认识而报错。
    import: "optional:file:../../.env[.properties]"
  datasource:
    url: ${SM_DB_URL}
    username: ${SM_DB_USER}
    password: ${SM_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migrations
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri 会连带做 iss 校验。容器内外 issuer 天然不一致
          # （容器里的 127.0.0.1 指自己），所以 compose 里改用 jwk-set-uri：
          # 只验签名，不校验 iss。两个都空则没有 JwtDecoder，启动会失败。
          issuer-uri: ${SM_KEYCLOAK_ISSUER:}
          jwk-set-uri: ${SM_KEYCLOAK_JWK_SET_URI:}

server:
  port: 8080
  address: 127.0.0.1
  error:
    include-message: never

skillmesh:
  minio:
    endpoint: ${SM_MINIO_ENDPOINT}
    access-key: ${SM_MINIO_ACCESS_KEY}
    secret-key: ${SM_MINIO_SECRET_KEY}
    bucket: ${SM_MINIO_BUCKET}
  web:
    base-url: ${SM_WEB_BASE_URL:http://127.0.0.1:5174}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
