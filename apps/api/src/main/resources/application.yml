spring:
  application:
    name: skillmesh-api
  config:
    import: "optional:file:./.env[.properties],optional:file:../../.env[.properties]"
  datasource:
    url: ${SM_DB_URL}
    username: ${SM_DB_USER}
    password: ${SM_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migrations
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SM_KEYCLOAK_ISSUER:}
          jwk-set-uri: ${SM_KEYCLOAK_JWK_SET_URI:}

server:
  port: 8080
  address: 127.0.0.1
  error:
    include-message: never

skillmesh:
  minio:
    endpoint: ${SM_MINIO_ENDPOINT}
    access-key: ${SM_MINIO_ACCESS_KEY}
    secret-key: ${SM_MINIO_SECRET_KEY}
    bucket: ${SM_MINIO_BUCKET}
    temp-expire-days: ${SM_MINIO_TEMP_EXPIRE_DAYS:1}
  oidc:
    issuer: ${SM_OIDC_ISSUER:${SM_KEYCLOAK_ISSUER:}}
    client-id: ${SM_OIDC_CLIENT_ID:skillmesh-cli}
  web:
    base-url: ${SM_WEB_BASE_URL:http://127.0.0.1:5174}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
