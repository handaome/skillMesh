spring:
  application:
    name: skillmesh-api
  config:
    import: "optional:file:./.env[.properties],optional:file:../../.env[.properties]"
  datasource:
    url: ${SM_DB_URL}
    username: ${SM_DB_USER}
    password: ${SM_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migrations
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  jackson:
    mapper:
      # 枚举取值不区分大小写。查询参数走 EnumParams，本来就大小写都认；
      # 请求体这边要是严格，同一个值换个入口就 400。
      accept-case-insensitive-enums: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # 外部 IdP 的 issuer。留空就只认内置账号（自签令牌），不装 IdP 也能跑。
          issuer-uri: ${SM_OIDC_ISSUER:}
          jwk-set-uri: ${SM_OIDC_JWK_SET_URI:}

server:
  port: 8080
  address: 127.0.0.1
  # 前面挂了反向代理（compose 里的 nginx、生产上的负载均衡）时，
  # 认 X-Forwarded-For / X-Forwarded-Proto：审计要记真实来源 IP，
  # 限流也要按真实 IP 分桶——不然所有请求都算在代理头上，全站共用一个额度。
  forward-headers-strategy: ${SM_FORWARD_HEADERS_STRATEGY:framework}
  error:
    include-message: never

skillmesh:
  minio:
    endpoint: ${SM_MINIO_ENDPOINT}
    access-key: ${SM_MINIO_ACCESS_KEY}
    secret-key: ${SM_MINIO_SECRET_KEY}
    bucket: ${SM_MINIO_BUCKET}
    temp-expire-days: ${SM_MINIO_TEMP_EXPIRE_DAYS:1}
  oidc:
    issuer: ${SM_OIDC_ISSUER:}
    client-id: ${SM_OIDC_CLIENT_ID:skillmesh-cli}
  # 内置账号：用户名 + 密码登录，不接外部 IdP 也能用。
  auth:
    # 令牌的签名密钥。没配就用随机的一次性密钥——重启后已登录的令牌全部失效，
    # 生产环境必须配 SM_JWT_SECRET。
    jwt-secret: ${SM_JWT_SECRET:}
    # 能不能自助注册。关掉就只有管理员能建号。
    allow-register: ${SM_ALLOW_REGISTER:true}
    access-token-minutes: ${SM_ACCESS_TOKEN_MINUTES:60}
    refresh-token-days: ${SM_REFRESH_TOKEN_DAYS:30}
  web:
    base-url: ${SM_WEB_BASE_URL:http://127.0.0.1:5174}
  # 下面的限额都能按环境调（设计文档 §14「设置制品大小、文件数、扫描时间和 API 请求频率限制」）。
  # 磁盘小的地方把制品与扫描的限额调紧，扫描慢的地方给扫描器更多时间。
  artifact:
    max-bytes: ${SM_ARTIFACT_MAX_BYTES:52428800}
    # 同时进行的下载数上限（设计文档 §4.1「下载并发限制」）。满了返回 429。
    max-concurrent-downloads: ${SM_ARTIFACT_MAX_CONCURRENT_DOWNLOADS:8}
  scan:
    max-file-bytes: ${SM_SCAN_MAX_FILE_BYTES:20971520}
    max-total-bytes: ${SM_SCAN_MAX_TOTAL_BYTES:52428800}
    max-files: ${SM_SCAN_MAX_FILES:5000}
    timeout-ms: ${SM_SCAN_TIMEOUT_MS:30000}
  rate-limit:
    read-per-minute: ${SM_RATE_LIMIT_READ:600}
    write-per-minute: ${SM_RATE_LIMIT_WRITE:300}
    window-seconds: ${SM_RATE_LIMIT_WINDOW:60}
  git:
    allowed-hosts: "${SM_GIT_ALLOWED_HOSTS:github.com,gitlab.com,gitee.com}"
    timeout-seconds: ${SM_GIT_TIMEOUT_SECONDS:30}
    max-concurrent: ${SM_GIT_MAX_CONCURRENT:4}
    # git 走哪个代理。留空就用系统环境里的 HTTPS_PROXY / HTTP_PROXY——
    # 服务端所在机器访问不了 GitHub 时，两者配一个就行。
    proxy: ${SM_GIT_PROXY:}
  # 备份（设计文档 §14「生产部署需要定期备份数据库与对象存储，并验证恢复流程」）。
  # 目录留空就是不做备份；配了就在启动时备份一次。
  backup:
    dir: ${SM_BACKUP_DIR:}
    # 定时备份默认不开：多副本部署时每个副本都备份一遍是白费力气，
    # 由部署方在一个实例上打开。
    schedule-enabled: ${SM_BACKUP_SCHEDULE_ENABLED:false}
    # 间隔用毫秒数：cron 得按时区解释，换个时区备份时间就悄悄变了。
    interval-ms: ${SM_BACKUP_INTERVAL_MS:3600000}
    # 启动后先等一会儿再跑第一次，别和迁移、启动扫描抢资源。
    initial-delay-ms: ${SM_BACKUP_INITIAL_DELAY_MS:600000}
    # 留最近的多少份备份。备份占的正是最要紧的那块盘，不清理迟早塞满。
    keep: ${SM_BACKUP_KEEP:24}
  # 回收站（设计文档 §6.4：删除走软删除，回收期内能恢复）。
  recycle:
    # 回收期到了的条目由定时任务清掉。默认开着：清理很便宜且幂等。
    cleanup-enabled: ${SM_RECYCLE_CLEANUP_ENABLED:true}
    # 间隔用毫秒数：cron 得按时区解释，换个时区清理时间就悄悄变了。
    cleanup-interval-ms: ${SM_RECYCLE_CLEANUP_INTERVAL_MS:3600000}
    # 启动后先等一会儿再跑第一次，别和迁移抢资源。
    cleanup-initial-delay-ms: ${SM_RECYCLE_CLEANUP_INITIAL_DELAY_MS:600000}
  # 审计表按月分区：到期整月分区直接 DROP，清理是一条语句的事。
  audit:
    # 分区维护与保留期清理。默认开着：清理很便宜且幂等。
    partition-enabled: ${SM_AUDIT_PARTITION_ENABLED:true}
    # 间隔用毫秒数：cron 得按时区解释，换个时区清理时间就悄悄变了。
    cleanup-interval-ms: ${SM_AUDIT_CLEANUP_INTERVAL_MS:86400000}
    # 启动后先等一会儿再跑第一次，别和迁移抢资源。
    cleanup-initial-delay-ms: ${SM_AUDIT_CLEANUP_INITIAL_DELAY_MS:600000}
    # 审计保留多少个月。超过这个月的审计整月分区丢掉。
    retention-months: ${SM_AUDIT_RETENTION_MONTHS:12}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
