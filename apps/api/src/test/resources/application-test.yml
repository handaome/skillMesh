spring:
  datasource:
    # 独立的测试库，与应用库 skill_mesh 完全隔离。
    # 测试里的清表操作不可能碰到应用数据。
    url: jdbc:postgresql://123.56.146.58:5432/skillmesh_test
    username: ${SM_DB_USER}
    password: ${SM_DB_PASSWORD}
  flyway:
    create-schemas: true
  jpa:
    properties:
      hibernate:
        default_schema: public

skillmesh:
  minio:
    endpoint: http://127.0.0.1:9100
    access-key: skillmesh
    secret-key: skillmesh-dev-secret
    bucket: skillmesh-test-artifacts
  test:
    client-id: skillmesh-test
    username: dev-user
    password: dev
  git:
    allowed-hosts: github.com,gitlab.com,gitee.com
    timeout-seconds: 30
  # 集成测试全部共用一个 Spring 上下文、同一个用户，额度默认会把后半程的测试全打成 429。
  # 限流逻辑由 RateLimitFilterTest 单独验证，这里放开。
  rate-limit:
    read-per-minute: 100000
    write-per-minute: 100000
