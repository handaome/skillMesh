server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 证书续期用的挑战目录：certbot --webroot -w <宿主机上同一个目录>。
    # 目录没挂进来时这里是 404，不影响别的。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 compose 里的 api 服务
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖，不是追加（$proxy_add_x_forwarded_for 是追加）：
        # 客户端可以自己带一个 X-Forwarded-For，追加的话它排在前面，
        # 后端取第一个就成了客户端说了算——审计记的 IP 能伪造，限流也能靠伪造 IP 换额度。
        # nginx 是唯一入口，直接用自己看到的对端地址覆盖掉。
        proxy_set_header X-Forwarded-For $remote_addr;
        # 告诉后端这请求原本是 https 还是 http：
        # 后端据此生成绝对地址、按真实 IP 记审计与限流。
        proxy_set_header X-Forwarded-Proto $scheme;
        # 主机名也覆盖掉：X-Forwarded-Host 客户端能自己带，带了就被后端当成真域名。
        proxy_set_header X-Forwarded-Host $host;
        # RFC 7239 的 Forwarded 头必须清掉：后端认它，而且优先级比 X-Forwarded-For 高——
        # 客户端自己发一个 Forwarded: for=1.2.3.4，审计记的 IP 与限流分桶就由它说了算。
        proxy_set_header Forwarded "";
    }
}
