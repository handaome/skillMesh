# 终止 TLS 的配置（设计文档 §14 要求服务端用 HTTPS）。
#
# 这个文件默认不生效——镜像里没有证书，nginx 启动会因为找不到证书直接失败。
# 开了 TLS 才把它挂进去：
#
#   web:
#     ports:
#       - "127.0.0.1:8443:443"
#     volumes:
#       - ./apps/web/nginx-tls.conf:/etc/nginx/conf.d/tls.conf:ro
#       - /etc/letsencrypt/live/<域名>:/etc/nginx/certs:ro
#
# 证书怎么签、怎么续期：docs/部署与排障.md 的「上 HTTPS」一节。

server {
    listen 443 ssl;
    http2 on;
    # 换成真域名。
    server_name skills.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 compose 里的 api 服务
    location /api/ {
        # 请求体上限。nginx 默认只有 1m，Skill 包稍大一点就在代理层被拒（413），
        # 根本到不了 API。这里的值要盖住服务端制品上限（SM_ARTIFACT_MAX_BYTES，
        # 默认 50 MB），调大服务端上限时这里也要一起调。
        client_max_body_size 64m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖，不是追加（$proxy_add_x_forwarded_for 是追加）：
        # 客户端可以自己带一个 X-Forwarded-For，追加的话它排在前面，
        # 后端取第一个就成了客户端说了算——审计记的 IP 能伪造，限流也能靠伪造 IP 换额度。
        # nginx 是唯一入口，直接用自己看到的对端地址覆盖掉。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 主机名也覆盖掉：X-Forwarded-Host 客户端能自己带，带了就被后端当成真域名。
        proxy_set_header X-Forwarded-Host $host;
        # RFC 7239 的 Forwarded 头必须清掉：后端认它，而且优先级比 X-Forwarded-For 高——
        # 客户端自己发一个 Forwarded: for=1.2.3.4，审计记的 IP 与限流分桶就由它说了算。
        proxy_set_header Forwarded "";
    }
}

# 明文 80 端口跳到 HTTPS。
#
# 证书续期用 HTTP-01 校验时需要 80 端口能通到：
# 那就把下面这个 server 块注释掉，让 80 端口继续由默认配置里的那个 server 接管。
#
# server {
#     listen 80;
#     server_name skills.example.com;
#     return 301 https://$host$request_uri;
# }
